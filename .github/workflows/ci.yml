name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]" build
      - run: python -m pytest -q
      - run: python -m build --wheel
      - name: Installed CLI smoke test
        run: |
          python -c "import json; import subprocess; result = subprocess.run(['inspect-agent', 'examples/demo_project', '--no-llm', '--format', 'json'], capture_output=True); assert result.returncode == 1, (result.returncode, result.stderr); data = json.loads(result.stdout.decode('utf-8')); rules = {item['rule_id'] for item in data['rule_findings']}; assert {'R001', 'R004'} <= rules, rules"
